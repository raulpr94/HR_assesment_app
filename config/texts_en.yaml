guide:
  intro: "This page explains the review cycle from your point of view ({role})."
  steps_title: The six steps
  col_step: Step
  col_who: Who
  col_what: What happens
  step_rows:
    - ["1 · Start", "Manager", "The manager ticks **Initiate** for you in the team table. You get an email."]
    - ["2 · Self-assessment", "Employee", "You answer the survey. Save drafts as often as you like; after **Submit** your answers are locked."]
    - ["3 · Manager assessment", "Manager", "The manager reads your self-assessment and answers the same questions. Also locked after submitting."]
    - ["4 · Meeting", "Manager", "The manager picks a date within the cycle. Both get a calendar invite; it can be moved until it happens."]
    - ["5 · Confirmations", "Both", "From the meeting date you both see both sides. Each confirms the review was discussed; the employee can add a comment."]
    - ["6 · Completed", "Automatic", "When both have confirmed, the review is complete and you both get a thank-you email."]
  cycle_line: "Current cycle **{name}**: {start} – {due}."
  reviewee_title: Your own review
  reviewee: |
    - **Wait for the start.** Your manager starts your review; you'll get an email and a button on the Overview page.
    - **Take your time with the self-assessment.** Rate each area from 1 to 5 and write a few honest sentences on strengths, development areas and goals. Use **Save draft** and come back later.
    - **Submitting is final.** Once you submit, your answers are locked. Your manager sees them only after you submit, never your drafts.
    - **Your manager's view.** You'll see your manager's assessment next to yours from the day of the meeting, so you can talk about both.
    - **After the meeting** tick *I confirm this review was discussed* and, if you like, add a comment for your manager and HR.
  manager_title: Reviewing your team
  manager: |
    - **Start each review** by ticking **Initiate** in the *My team* table on the Overview page, then **Save changes**.
    - **Wait for the self-assessment.** You'll get an email when it's in. You can't see drafts.
    - **Write your assessment** on the Review page: the self-assessment is shown next to your form. Save drafts; submit when done (it's then locked).
    - **Schedule the meeting** by picking a date and time in the *Meeting* column. It must be in the future and within the cycle; you can move it until it takes place.
    - **After the meeting** both of you confirm on the Review page; the second confirmation completes the review.
  line_manager_note: "**As a line manager**, you can start your team's reviews only once your own review is completed. Until then the *Initiate* column stays locked."
  timeline_title: Suggested timeline
  timeline_intro: "A steady pace that leaves time for meetings before the due date. These are suggestions, not hard deadlines."
  col_by: Aim to finish by
  timeline_steps:
    initiate: All reviews started
    submit_self: Self-assessments submitted
    submit_manager: Manager assessments submitted
    schedule_meeting: Meetings scheduled
    acknowledge: Meetings held and confirmed
  department_note: "**As a department manager** you review your line managers first: their own reviews must be completed before they can start reviews for their teams. The **Dashboard** shows progress across your whole department."
  hr_title: HR tasks
  hr: |
    - **Open the cycle** on the Admin page (department managers are notified) and close it at the end.
    - **Keep the hierarchy current** by uploading the employee CSV; every problem is listed before anything is imported.
    - **Follow progress** on the Dashboard and in *All reviews* on the Overview page, with filters.
    - **Fix mistakes** with an override: move a review one step forward or back. A reason is required and logged; going back unlocks the matching answers.
    - **Notifications** are queued in the outbox; send them from the Admin page (dry run until Zapier is configured).
  privacy_title: Who sees what
  privacy: |
    - Your manager sees your self-assessment only after you submit it.
    - You see your manager's assessment from the meeting date.
    - Managers higher up see the progress of reviews in their area, not the answers. The Dashboard shows averages only for groups of at least {min} answers.
    - HR sees everything. Nobody sees reviews outside their own reporting line.

